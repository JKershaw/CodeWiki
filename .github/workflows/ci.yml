# CodeWiki CI/CD Pipeline
#
# Runs tests against both file-based and MongoDB storage backends
# to ensure implementation parity between the two.
#
# References:
# - https://docs.github.com/actions/using-workflows/workflow-syntax-for-github-actions
# - https://github.com/actions/example-services/blob/main/.github/workflows/mongodb-service.yml

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: '20'

jobs:
  # Run linting and type checking
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run type check
        run: npm run typecheck

      - name: Run linter
        run: npm run lint

  # Build the project
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

  # Run tests with file-based storage (default)
  test-file-storage:
    name: Test (File Storage)
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run unit and integration tests
        run: npm test

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Build application
        run: npm run build

      - name: Run E2E tests
        run: npm run test:e2e

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-file-storage
          path: playwright-report/
          retention-days: 7

  # Run tests with MongoDB storage
  # Note: This job will fail until MongoDB repositories are implemented.
  # Once implemented, remove continue-on-error to make it a required check.
  test-mongodb-storage:
    name: Test (MongoDB Storage)
    runs-on: ubuntu-latest
    needs: build
    continue-on-error: true  # TODO: Remove once MongoDB repositories are implemented

    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
          --health-start-period 10s

    env:
      MONGODB_URI: mongodb://localhost:27017/codewiki-test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run unit and integration tests with MongoDB
        # MongoDB service health check ensures it's ready before this step runs
        run: npm test

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Build application
        run: npm run build

      - name: Run E2E tests with MongoDB
        run: npm run test:e2e

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-mongodb
          path: playwright-report/
          retention-days: 7

  # Summary job that depends on all test jobs
  ci-success:
    name: CI Success
    runs-on: ubuntu-latest
    needs: [lint, build, test-file-storage, test-mongodb-storage]
    if: always()
    steps:
      - name: Check required jobs passed
        run: |
          # Required jobs must pass
          if [[ "${{ needs.lint.result }}" != "success" ]] || \
             [[ "${{ needs.build.result }}" != "success" ]] || \
             [[ "${{ needs.test-file-storage.result }}" != "success" ]]; then
            echo "One or more required jobs failed"
            exit 1
          fi

          # MongoDB tests are optional until implementation is complete
          # TODO: Make this required once MongoDB repositories are implemented
          if [[ "${{ needs.test-mongodb-storage.result }}" != "success" ]]; then
            echo "Warning: MongoDB tests failed (expected until implementation is complete)"
          fi

          echo "All required CI jobs passed successfully!"
